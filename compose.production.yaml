name: codekids-production

services:
  api:
    build:
      context: .
      target: api
    command: npm run start:prod --workspace @codekids/backend
    env_file:
      - .env.production.local
    environment:
      NODE_ENV: production
      PORT: 3001
      WEB_ORIGIN: http://localhost:3003
      DB_SYNCHRONIZE: 'false'
      JWT_SECRET: local-codekids-access-secret-change-for-production
      JWT_REFRESH_SECRET: local-codekids-refresh-secret-change-for-production
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      AVATAR_UPLOAD_DIR: /app/storage/avatars
    ports:
      - '3001:3001'
    volumes:
      - codekids_avatars:/app/storage/avatars
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/api/docs').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_CODEKIDS_API_URL: http://localhost:3001
    environment:
      NODE_ENV: production
      PORT: 3003
    ports:
      - '3003:3003'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3003').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  codekids_avatars:
